name: Deploy

# 1. Worker (Speicher-Schnittstelle) auf Cloudflare veröffentlichen
# 2. Oberfläche auf GitHub Pages veröffentlichen (https://children-of-finances.children-of-mathare.de)
#
# Start: bei jedem Push auf main – oder manuell über GitHub → Actions → Deploy → „Run workflow“.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  worker:
    name: Cloudflare Worker
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.setup.outputs.api_url }}
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Datenbank und Schlüssel einrichten
        id: setup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PASSWORD_USER: ${{ secrets.PASSWORD_USER }}
          PASSWORD_ADMIN: ${{ secrets.PASSWORD_ADMIN }}
        run: node scripts/setup.mjs

      - name: Worker veröffentlichen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

  pages:
    name: GitHub Pages
    needs: worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Ist GitHub Pages aktiviert?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type' 2>/dev/null || true)
          if [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages noch nicht eingerichtet::Settings → Pages → Source: „GitHub Actions“ wählen und den Workflow erneut starten. Der Worker wurde trotzdem veröffentlicht."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'

      - name: Worker-Adresse in die Oberfläche eintragen
        if: steps.check.outputs.enabled == 'true'
        env:
          API_URL: ${{ needs.worker.outputs.api_url }}
        run: |
          test -n "$API_URL" || { echo "::error::Worker-Adresse fehlt"; exit 1; }
          sed -i "s#window.COF_API = '[^']*';#window.COF_API = '${API_URL}';#" public/config.js
          grep -q "${API_URL}" public/config.js
          cat public/config.js

      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.enabled == 'true'
        with:
          path: public

      - name: Veröffentlichen
        id: deploy
        if: steps.check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
